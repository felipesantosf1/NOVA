
[build-system]
# Ferramenta usada para "montar" o projeto na hora da instalação.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-assistant"
version = "0.2.0"
description = "Assistente virtual pessoal com IA local e memória persistente"
requires-python = ">=3.11"

# Bibliotecas de que a NOVA precisa.
dependencies = [
    "ollama>=0.6.3",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

# Dependências só para DESENVOLVER
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Diz ao setuptools onde está o código: dentro da pasta src/.
[tool.setuptools.packages.find]
where = ["src"]
